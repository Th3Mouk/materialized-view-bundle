name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  static:
    name: Static analysis & code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: materialized-view-bundle
      # The bundle resolves th3mouk/materialized-view through a Composer path repository
      # (../materialized-view). Check the library out as a sibling at the matching release
      # tag so the path repo advertises a stable version satisfying the ^1.2 constraint.
      - uses: actions/checkout@v4
        with:
          repository: Th3Mouk/materialized-view
          ref: v1.2.0
          path: materialized-view
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: materialized-view-bundle
      - run: composer cs:check
        working-directory: materialized-view-bundle
      - run: composer stan
        working-directory: materialized-view-bundle

  test:
    name: Tests (Symfony ${{ matrix.symfony }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        symfony: [ '8.0.*' ]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: matview_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SYMFONY_REQUIRE: ${{ matrix.symfony }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: materialized-view-bundle
      - uses: actions/checkout@v4
        with:
          repository: Th3Mouk/materialized-view
          ref: v1.2.0
          path: materialized-view
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql
      - run: composer install --no-interaction --prefer-dist
        working-directory: materialized-view-bundle
      - run: composer test
        working-directory: materialized-view-bundle
